server {
    listen 80;
    listen [::]:80;
    server_name wedfotobook.ru www.wedfotobook.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 302 https://fotobooktest24.ru$request_uri;
    }
}
